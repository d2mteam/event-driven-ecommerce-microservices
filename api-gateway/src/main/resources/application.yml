spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: "${USER_SERVICE_URL:http://localhost:8087}"
              predicates:
                - Path=/api/auth/**
                - Method=POST
            - id: product-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/products,/api/products/**
                - Method=GET
            - id: order-service
              uri: "${ORDER_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/orders,/api/orders/**
                - Method=GET,POST
            - id: payment-service
              uri: "${PAYMENT_SERVICE_URL:http://localhost:8086}"
              predicates:
                - Path=/api/payments,/api/payments/**
                - Method=GET,POST
          httpclient:
            connect-timeout: "${GATEWAY_CONNECT_TIMEOUT_MS:2000}"
            response-timeout: "${GATEWAY_RESPONSE_TIMEOUT:10s}"
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${GATEWAY_CORS_ALLOWED_ORIGINS:*}"
                allowedMethods: [GET, POST]
                allowedHeaders: "*"

security:
  app:
    jwt-public-key: "${JWT_PUBLIC_KEY:classpath:jwt-public.pem}"

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
