spring:
  # Virtual thread: mỗi request một thread ảo thay cho pool cố định.
  # Hợp vì service ở đây chủ yếu chờ I/O (DB, HTTP, Kafka) chứ không tính toán.
  threads:
    virtual:
      enabled: true
  application:
    name: api-gateway
  codec:
    max-in-memory-size: "${GATEWAY_MAX_IN_MEMORY_SIZE:5MB}"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: "${USER_SERVICE_URL:http://localhost:8087}"
              predicates:
                - Path=/api/auth/**
                - Method=POST
            - id: product-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/products,/api/products/**
                - Method=GET
            - id: category-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/categories
                - Method=GET
            - id: cart-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/cart,/api/cart/**
                - Method=GET,PUT,DELETE
            - id: notification-service
              uri: "${NOTIFICATION_SERVICE_URL:http://localhost:8084}"
              predicates:
                - Path=/api/notifications,/api/notifications/**
                - Method=GET
              metadata:
                response-timeout: -1
            - id: product-admin-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/admin/products,/api/admin/products/**
                - Method=POST,PUT,DELETE
            - id: category-admin-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/admin/categories,/api/admin/categories/**
                - Method=GET,POST,PUT,DELETE
            - id: product-image-admin-service
              uri: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
              predicates:
                - Path=/api/admin/product-images,/api/admin/product-images/**
                - Method=POST
            - id: inventory-admin-service
              uri: "${INVENTORY_SERVICE_URL:http://localhost:8083}"
              predicates:
                - Path=/api/admin/inventory/**
                - Method=POST
            - id: order-admin-service
              uri: "${ORDER_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/admin/orders,/api/admin/orders/**
                - Method=GET
            - id: user-admin-service
              uri: "${USER_SERVICE_URL:http://localhost:8087}"
              predicates:
                - Path=/api/admin/users,/api/admin/users/**
                - Method=GET,PUT
            - id: order-service
              uri: "${ORDER_SERVICE_URL:http://localhost:8082}"
              predicates:
                - Path=/api/orders,/api/orders/**
                - Method=GET,POST
            - id: payment-service
              uri: "${PAYMENT_SERVICE_URL:http://localhost:8086}"
              predicates:
                - Path=/api/payments,/api/payments/**
                - Method=GET,POST
          httpclient:
            connect-timeout: "${GATEWAY_CONNECT_TIMEOUT_MS:2000}"
            response-timeout: "${GATEWAY_RESPONSE_TIMEOUT:10s}"
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "${GATEWAY_CORS_ALLOWED_ORIGINS:*}"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"

app:
  services:
    product-base-url: "${PRODUCT_SERVICE_URL:http://localhost:8081}"
    inventory-base-url: "${INVENTORY_SERVICE_URL:http://localhost:8083}"
  admin-catalog:
    timeout: "${ADMIN_CATALOG_TIMEOUT:10s}"

security:
  app:
    jwt-public-key: "${JWT_PUBLIC_KEY:classpath:jwt-public.pem}"

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.server.ResponseStatusException
    instances:
      admin-product-service:
        base-config: default
      admin-inventory-service:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
