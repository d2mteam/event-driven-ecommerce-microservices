spring:
  application:
    name: inventory-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  task:
    scheduling:
      pool:
        size: 2
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: "${KAFKA_CONSUMER_GROUP_ID:inventory-service}"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

app:
  kafka:
    retry:
      max-attempts: 10
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 30s
      dead-letter-topic: "${INVENTORY_DLT_TOPIC:order.events.inventory-service.DLT}"
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: 1
  inventory:
    reservation:
      ttl: "${INVENTORY_RESERVATION_TTL:30m}"
      sweep-delay: "${INVENTORY_RESERVATION_SWEEP_DELAY:30s}"
      batch-size: "${INVENTORY_RESERVATION_BATCH_SIZE:50}"
      max-batches-per-run: "${INVENTORY_RESERVATION_MAX_BATCHES_PER_RUN:10}"
    outbox:
      initial-delay: "${INVENTORY_OUTBOX_INITIAL_DELAY:2s}"
      fixed-delay: "${INVENTORY_OUTBOX_FIXED_DELAY:1s}"
      batch-size: "${INVENTORY_OUTBOX_BATCH_SIZE:50}"
      send-timeout: "${INVENTORY_OUTBOX_SEND_TIMEOUT:10s}"
      lease-duration: "${INVENTORY_OUTBOX_LEASE_DURATION:10m}"
      retry-initial-delay: "${INVENTORY_OUTBOX_RETRY_INITIAL_DELAY:1s}"
      retry-multiplier: "${INVENTORY_OUTBOX_RETRY_MULTIPLIER:2.0}"
      retry-max-delay: "${INVENTORY_OUTBOX_RETRY_MAX_DELAY:60s}"
      alert-after-attempts: "${INVENTORY_OUTBOX_ALERT_AFTER_ATTEMPTS:10}"
  messaging:
    topics:
      order-events: "${ORDER_EVENTS_TOPIC:order.events}"
      inventory-events: "${INVENTORY_EVENTS_TOPIC:inventory.events}"

server:
  port: 8083
