spring:
  application:
    name: inventory-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}"
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: "${KAFKA_CONSUMER_GROUP_ID:inventory-service}"
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  inventory:
    reservation:
      ttl: "${INVENTORY_RESERVATION_TTL:30m}"
      sweep-delay: "${INVENTORY_RESERVATION_SWEEP_DELAY:30s}"
      batch-size: "${INVENTORY_RESERVATION_BATCH_SIZE:50}"
      max-batches-per-run: "${INVENTORY_RESERVATION_MAX_BATCHES_PER_RUN:10}"
      event-relay-delay: "${INVENTORY_EVENT_RELAY_DELAY:1s}"
      event-relay-batch-size: "${INVENTORY_EVENT_RELAY_BATCH_SIZE:50}"
      event-send-timeout: "${INVENTORY_EVENT_SEND_TIMEOUT:10s}"
  messaging:
    topics:
      order-events: "${ORDER_EVENTS_TOPIC:order.events}"
      inventory-events: "${INVENTORY_EVENTS_TOPIC:inventory.events}"

server:
  port: 8083
