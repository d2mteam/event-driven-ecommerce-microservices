spring:
  application:
    name: notification-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}"
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      type: single
      ack-mode: record
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  user-service:
    base-url: "${USER_SERVICE_URL:http://localhost:8087}"
  kafka:
    retry:
      max-attempts: 10
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 30s
      history-dead-letter-topic: "${NOTIFICATION_DLT_TOPIC:order.events.notification-history.DLT}"
      email-dead-letter-topic: "${NOTIFICATION_EMAIL_DLT_TOPIC:order.events.notification-email.DLT}"
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: 1
  messaging:
    topics:
      order-events: "${ORDER_EVENTS_TOPIC:order.events}"
    history:
      group-id: "${NOTIFICATION_KAFKA_GROUP_ID:notification-history}"
    email:
      group-id: "${NOTIFICATION_EMAIL_KAFKA_GROUP_ID:notification-email}"
  notification:
    success-message-template: "Đơn hàng %s đã được xác nhận thành công."
    failure-message-template: "Đơn hàng %s thất bại (%s)."
    cancellation-message-template: "Đơn hàng %s đã được hủy và hoàn tiền."

server:
  port: 8084
