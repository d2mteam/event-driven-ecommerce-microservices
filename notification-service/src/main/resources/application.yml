spring:
  application:
    name: notification-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}"
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  kafka:
    retry:
      max-attempts: 10
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 30s
      dead-letter-topic: "${NOTIFICATION_DLT_TOPIC:order.events.notification-service.DLT}"
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: 1
  messaging:
    topics:
      order-events: "${ORDER_EVENTS_TOPIC:order.events}"
    notification:
      group-id: "${NOTIFICATION_KAFKA_GROUP_ID:notification-service}"
  notification:
    success-message-template: "Đơn hàng %s đã được xác nhận thành công."
    failure-message-template: "Đơn hàng %s thất bại (%s)."
    cancellation-message-template: "Đơn hàng %s đã được hủy và hoàn tiền."

server:
  port: 8084
