spring:
  application:
    name: order-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}"
    admin:
      fail-fast: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    properties:
      request.timeout.ms: 10000
      default.api.timeout.ms: 10000

app:
  clients:
    product-base-url: "${PRODUCT_SERVICE_BASE_URL:http://localhost:8081}"
    inventory-base-url: "${INVENTORY_SERVICE_BASE_URL:http://localhost:8083}"
    payment-base-url: "${PAYMENT_SERVICE_BASE_URL:http://localhost:8086}"
    connect-timeout: "${SERVICE_CONNECT_TIMEOUT:2s}"
    read-timeout: "${SERVICE_READ_TIMEOUT:5s}"
  kafka:
    consumer-group-id: "${ORDER_KAFKA_GROUP_ID:order-service}"
    topics:
      order-events: "${ORDER_EVENTS_TOPIC:order.events}"
      inventory-events: "${INVENTORY_EVENTS_TOPIC:inventory.events}"
      payment-events: "${PAYMENT_EVENTS_TOPIC:payment.events}"
    topic:
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: "${KAFKA_TOPIC_REPLICATION_FACTOR:3}"
      min-in-sync-replicas: "${KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS:2}"
    retry:
      max-attempts: "${KAFKA_CONSUMER_MAX_ATTEMPTS:10}"
      initial-interval: "${KAFKA_CONSUMER_RETRY_INITIAL_INTERVAL:1s}"
      multiplier: "${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}"
      max-interval: "${KAFKA_CONSUMER_RETRY_MAX_INTERVAL:30s}"
      payment-dead-letter-topic: "${PAYMENT_ORDER_DLT_TOPIC:payment.events.order-service.DLT}"
      inventory-dead-letter-topic: "${INVENTORY_ORDER_DLT_TOPIC:inventory.events.order-service.DLT}"
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: "${KAFKA_TOPIC_REPLICATION_FACTOR:1}"
  outbox:
    initial-delay: "${OUTBOX_RELAY_INITIAL_DELAY:2s}"
    fixed-delay: "${OUTBOX_RELAY_FIXED_DELAY:1s}"
    batch-size: "${OUTBOX_RELAY_BATCH_SIZE:50}"
    send-timeout: "${OUTBOX_RELAY_SEND_TIMEOUT:10s}"
    lease-duration: "${OUTBOX_RELAY_LEASE_DURATION:10m}"
    retry-initial-delay: "${OUTBOX_RELAY_RETRY_INITIAL_DELAY:1s}"
    retry-multiplier: "${OUTBOX_RELAY_RETRY_MULTIPLIER:2.0}"
    retry-max-delay: "${OUTBOX_RELAY_RETRY_MAX_DELAY:60s}"
    alert-after-attempts: "${OUTBOX_RELAY_ALERT_AFTER_ATTEMPTS:10}"

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.app.order.exception.DownstreamServiceException
    instances:
      product-service:
        base-config: default
      inventory-service:
        base-config: default
      payment-service:
        base-config: default

server:
  port: 8082
