spring:
  application:
    name: payment-gateway
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}"
    admin:
      fail-fast: true
    producer:
      acks: all
      # Relay bắn cả lô một lúc; chờ thêm chút để producer gom được batch to hơn.
      properties:
        linger.ms: 5
        # Kafka chết thì send() phải hỏng nhanh, đừng chặn 60s chờ metadata.
        max.block.ms: 2000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    properties:
      request.timeout.ms: 10000
      default.api.timeout.ms: 10000
  task:
    scheduling:
      pool:
        size: 2

app:
  payment:
    provider: "${PAYMENT_PROVIDER:MOCK}"
    ttl: "${PAYMENT_TTL:15m}"
    sweep-delay: "${PAYMENT_SWEEP_DELAY:30s}"
    public-base-url: "${PAYMENT_PUBLIC_BASE_URL:http://localhost:8080}"
    sweep-batch-size: "${PAYMENT_SWEEP_BATCH_SIZE:50}"
    max-sweep-batches-per-run: "${PAYMENT_MAX_SWEEP_BATCHES_PER_RUN:10}"
    vnpay:
      pay-url: "${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
      api-url: "${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}"
      tmn-code: "${VNPAY_TMN_CODE:DEMOV210}"
      hash-secret: "${VNPAY_HASH_SECRET:local-demo-secret}"
      return-url: "${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}"
      frontend-base-url: "${PAYMENT_FRONTEND_BASE_URL:http://localhost:5173}"
      version: "2.1.0"
      order-type: "other"
      locale: "vn"
  messaging:
    consumer-group-id: "${PAYMENT_KAFKA_GROUP_ID:payment-gateway}"
    topics:
      payment-events: "${PAYMENT_EVENTS_TOPIC:payment.events}"
      order-events: "${ORDER_EVENTS_TOPIC:order.events}"
    topic:
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: "${KAFKA_TOPIC_REPLICATION_FACTOR:1}"
      min-in-sync-replicas: "${KAFKA_TOPIC_MIN_IN_SYNC_REPLICAS:1}"
  kafka:
    retry:
      max-attempts: "${KAFKA_CONSUMER_MAX_ATTEMPTS:10}"
      initial-interval: "${KAFKA_CONSUMER_RETRY_INITIAL_INTERVAL:1s}"
      multiplier: "${KAFKA_CONSUMER_RETRY_MULTIPLIER:2.0}"
      max-interval: "${KAFKA_CONSUMER_RETRY_MAX_INTERVAL:30s}"
      dead-letter-topic: "${PAYMENT_ORDER_DLT_TOPIC:order.events.payment-gateway.DLT}"
      partitions: "${KAFKA_TOPIC_PARTITIONS:3}"
      replication-factor: "${KAFKA_TOPIC_REPLICATION_FACTOR:1}"
  outbox:
    initial-delay: "${PAYMENT_OUTBOX_INITIAL_DELAY:2s}"
    fixed-delay: "${PAYMENT_OUTBOX_FIXED_DELAY:100ms}"
    batch-size: "${PAYMENT_OUTBOX_BATCH_SIZE:500}"
    send-timeout: "${PAYMENT_OUTBOX_SEND_TIMEOUT:2s}"
    lease-duration: "${PAYMENT_OUTBOX_LEASE_DURATION:5m}"
    retry-delay: "${PAYMENT_OUTBOX_RETRY_DELAY:5s}"
    max-attempts: "${PAYMENT_OUTBOX_MAX_ATTEMPTS:10}"

server:
  port: 8086
