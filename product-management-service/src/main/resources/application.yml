spring:
  # Virtual thread: mỗi request một thread ảo thay cho pool cố định.
  # Hợp vì service ở đây chủ yếu chờ I/O (DB, HTTP, Kafka) chứ không tính toán.
  threads:
    virtual:
      enabled: true
  application:
    name: product-management-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  cache:
    type: redis
    redis:
      time-to-live: "${PRODUCT_CACHE_TTL:10m}"
      cache-null-values: false
      key-prefix: "${PRODUCT_CACHE_KEY_PREFIX:product-service::}"
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:2s}"
      timeout: "${REDIS_TIMEOUT:2s}"
      repositories:
        enabled: false
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

server:
  port: 8081

app:
  cart:
    ttl: "${CART_TTL:7d}"
  storage:
    # Service tự gọi MinIO qua địa chỉ này.
    endpoint: "${MINIO_ENDPOINT:http://localhost:9010}"
    # Địa chỉ trình duyệt gọi được: dùng cho URL ký sẵn và URL ảnh trả ra.
    # Bỏ trống thì lấy theo endpoint, nên chạy trên host không cần đặt.
    public-endpoint: "${MINIO_PUBLIC_ENDPOINT:}"
    bucket: "${MINIO_BUCKET:product-images}"
    access-key: "${MINIO_ACCESS_KEY:minioadmin}"
    secret-key: "${MINIO_SECRET_KEY:minioadmin}"
    presign-ttl: "${MINIO_PRESIGN_TTL:5m}"
