spring:
  application:
    name: product-management-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

server:
  port: 8081
