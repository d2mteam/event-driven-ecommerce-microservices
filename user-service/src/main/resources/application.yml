spring:
  application:
    name: user-service
  datasource:
    url: "${DB_URL:jdbc:mariadb://localhost:3306/ecommerce_db}"
    username: "${DB_USERNAME:app_user}"
    password: "${DB_PASSWORD:password}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  mail:
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1025}"
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
app:
  password-reset:
    frontend-url: "${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}"
    ttl: "${PASSWORD_RESET_TTL:15m}"
    from: "${PASSWORD_RESET_FROM:no-reply@mini-store.local}"
security:
  app:
    jwt-private-key: "${JWT_PRIVATE_KEY:classpath:jwt-private.pem}"
    jwt-public-key: "${JWT_PUBLIC_KEY:classpath:jwt-public.pem}"
    jwt-access-expiration-ms: "${JWT_ACCESS_EXPIRATION_MS:900000}"
    jwt-refresh-expiration-ms: "${JWT_REFRESH_EXPIRATION_MS:604800000}"
    default-admin-username: "${DEFAULT_ADMIN_USERNAME:admin}"
    default-admin-password: "${DEFAULT_ADMIN_PASSWORD:admin123}"
    default-admin-email: "${DEFAULT_ADMIN_EMAIL:admin@example.com}"
server:
  port: 8087
